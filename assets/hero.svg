<svg width="1120" height="720" viewBox="0 0 1120 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Peter Mölzer terminal portfolio</title>
  <desc id="desc">A terminal-style profile for Peter Mölzer, a software developer in Berlin.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
      .fg { fill: oklch(0.92 0.014 245); }
      .muted { fill: oklch(0.65 0.025 245); }
      .accent { fill: oklch(0.79 0.17 145); }
      .label { font-size: 12px; letter-spacing: 0.96px; text-transform: uppercase; }
    </style>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="window">
      <rect x="0.5" y="0.5" width="1119" height="719" rx="7.5"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="0.5" y="0.5" width="1119" height="719" rx="7.5" fill="oklch(0.185 0.014 245)" stroke="oklch(0.40 0.022 245)"/>
  </g>

  <g clip-path="url(#window)">
    <line x1="0" y1="52.5" x2="1120" y2="52.5" stroke="oklch(0.40 0.022 245)"/>
    <line x1="777.5" y1="53" x2="777.5" y2="664" stroke="oklch(0.40 0.022 245)"/>
    <line x1="0" y1="664.5" x2="1120" y2="664.5" stroke="oklch(0.40 0.022 245)"/>

    <g aria-label="Window controls">
      <circle cx="23" cy="26" r="5" fill="#EF4444" stroke="oklch(0.65 0.025 245)"/>
      <circle cx="41" cy="26" r="5" fill="#F59E0B" stroke="oklch(0.65 0.025 245)"/>
      <circle cx="59" cy="26" r="5" fill="#84CC16" stroke="oklch(0.65 0.025 245)"/>
    </g>

    <g aria-label="Online status">
      <circle cx="1034.5" cy="26" r="7" fill="oklch(0.79 0.17 145)" opacity="0.45" filter="url(#glow)"/>
      <circle cx="1034.5" cy="26" r="3.5" fill="oklch(0.79 0.17 145)"/>
      <text x="1050" y="30" class="mono fg label">ONLINE</text>
    </g>

    <g class="mono" font-size="14">
      <text x="56" y="123" class="accent" letter-spacing="0.28">peterle95@github</text>
      <text x="190" y="123" class="fg" letter-spacing="0.28"> ~$ whoami</text>
    </g>

    <text x="56" y="240" class="sans fg" font-size="90" font-weight="600" letter-spacing="-2.7">Peter</text>
    <text x="56" y="332" class="sans fg" font-size="90" font-weight="600" letter-spacing="-2.7">Mölzer</text>

    <text x="56" y="405" class="sans fg" font-size="18" font-weight="550">Software developer</text>
    <text x="222" y="405" class="sans muted" font-size="18"> building useful systems from UI to infrastructure.</text>

    <g transform="translate(802 81)">
      <text x="0" y="0" class="mono muted label">LOCATION</text>
      <text x="0" y="41" class="sans fg" font-size="15">Berlin / DE</text>
    </g>
    <line x1="778" y1="160.5" x2="1120" y2="160.5" stroke="oklch(0.40 0.022 245)"/>

    <g transform="translate(802 189)">
      <text x="0" y="0" class="mono muted label">RUNTIME / TOOLKIT</text>
      <g class="mono muted" font-size="12">
        <rect x="0.5" y="22.5" width="86" height="31" rx="7.5" stroke="oklch(0.40 0.022 245)"/>
        <text x="9" y="43">TypeScript</text>
        <rect x="94.5" y="22.5" width="53" height="31" rx="7.5" stroke="oklch(0.40 0.022 245)"/>
        <text x="103" y="43">React</text>
        <rect x="155.5" y="22.5" width="67" height="31" rx="7.5" stroke="oklch(0.40 0.022 245)"/>
        <text x="164" y="43">Next.js</text>
        <rect x="230.5" y="22.5" width="56" height="31" rx="7.5" stroke="oklch(0.40 0.022 245)"/>
        <text x="239" y="43">C/C++</text>
        <rect x="0.5" y="61.5" width="61" height="31" rx="7.5" stroke="oklch(0.40 0.022 245)"/>
        <text x="9" y="82">Docker</text>
      </g>
    </g>
    <line x1="778" y1="306.5" x2="1120" y2="306.5" stroke="oklch(0.40 0.022 245)"/>

    <text x="18" y="697" class="sans muted" font-size="12">session: active · last login: berlin/de</text>
  </g>
</svg>
