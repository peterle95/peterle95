<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Peter Mölzer — Terminal Portfolio</title>
  <style>
    :root {
      --bg: oklch(0.145 0.012 245);
      --surface: oklch(0.185 0.014 245);
      --fg: oklch(0.92 0.014 245);
      --muted: oklch(0.65 0.025 245);
      --border: oklch(0.40 0.022 245);
      --accent: oklch(0.79 0.17 145);
      --font-sans: Inter, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--fg);
      background: var(--bg);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.6;
    }

    button,
    input { font: inherit; }

    button,
    a { -webkit-tap-highlight-color: transparent; }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: center;
    }

    .terminal {
      width: min(1120px, 100%);
      min-height: min(720px, calc(100vh - 48px));
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 24px 80px oklch(0 0 0 / 0.28);
    }

    .titlebar {
      min-height: 52px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
    }

    .traffic { display: flex; gap: 8px; }

    .traffic span {
      width: 10px;
      height: 10px;
      border: 1px solid var(--muted);
      border-radius: 50%;
    }

    .window-title,
    .eyebrow,
    .meta-label,
    .status {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .window-title { color: var(--muted); }

    .status {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--fg);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(240px, 0.75fr);
    }

    .main-pane {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 5vw, 72px);
      border-right: 1px solid var(--border);
    }

    .prompt {
      margin: 0 0 26px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .prompt .command { color: var(--fg); }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(44px, 8vw, 92px);
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -0.03em;
    }

    .role {
      max-width: 58ch;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 1.5vw, 18px);
    }

    .role strong { color: var(--fg); font-weight: 550; }

    .command-line {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      margin-top: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      font-family: var(--font-mono);
    }

    .command-prefix { color: var(--fg); }

    .command-line input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      color: var(--fg);
      background: transparent;
      caret-color: var(--accent);
    }

    .command-line input::placeholder { color: var(--muted); opacity: 1; }

    .command-line:focus-within {
      border-color: var(--fg);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .hint {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.01em;
    }

    .side-pane {
      display: grid;
      align-content: start;
      grid-auto-rows: min-content;
    }

    .side-block {
      padding: 24px;
      border-bottom: 1px solid var(--border);
    }

    .meta-label {
      display: block;
      margin-bottom: 14px;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    .meta-value { margin: 0; color: var(--fg); }

    .stack {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .stack li {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .footer a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .output {
      min-height: 32px;
      margin-top: 18px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .output:empty { display: none; }

    .footer {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .links { display: flex; align-items: center; gap: 18px; }

    .footer a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      color: var(--fg);
      text-decoration-color: var(--border);
      text-underline-offset: 4px;
    }

    .footer a:hover { text-decoration-color: var(--fg); }

    @media (max-width: 760px) {
      .page { place-items: stretch; padding: 0; background-image: none; }
      .terminal { min-height: 100vh; border: 0; border-radius: 0; }
      .workspace { grid-template-columns: 1fr; }
      .main-pane { padding: 40px 20px; border-right: 0; }
      .side-pane { border-top: 1px solid var(--border); }
      .footer { align-items: flex-start; flex-direction: column; padding: 14px 20px; }
      .links { width: 100%; justify-content: space-between; }
    }

    @media (max-width: 430px) {
      .titlebar { grid-template-columns: 1fr 1fr; }
      .window-title { display: none; }
      h1 { font-size: clamp(40px, 16vw, 62px); }
      .links { gap: 12px; flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page" data-od-id="portfolio-page">
    <section class="terminal" data-od-id="terminal-window" aria-label="Peter Mölzer portfolio terminal">
      <header class="titlebar" data-od-id="terminal-titlebar">
        <div class="traffic" aria-hidden="true"><span style="background-color: rgb(239, 68, 68);"></span><span style="background-color: rgb(245, 158, 11);"></span><span style="background-color: rgb(132, 204, 22);"></span></div>
        <span class="window-title" style="transform: translate(-344px, 0px);"></span>
        <span class="status"><span class="status-dot" aria-hidden="true"></span>online</span>
      </header>

      <div class="workspace">
        <section class="main-pane" data-od-id="profile-panel">
          <div>
            <p class="prompt" data-od-id="profile-command">peterle95@github <span class="command">~$ whoami</span></p>
            <h1 data-od-id="profile-heading">Peter<br>Mölzer</h1>
            <p class="role" data-od-id="profile-summary"><strong>Software developer</strong> building useful systems from UI to infrastructure.</p>
          </div>

          
        </section>

        <aside class="side-pane" data-od-id="system-panel">
          <section class="side-block" data-od-id="location-block">
            <span class="meta-label">location</span>
            <p class="meta-value">Berlin / DE</p>
          </section>

          <section class="side-block" data-od-id="stack-block">
            <span class="meta-label">runtime / toolkit</span>
            <ul class="stack" aria-label="Technology stack">
              <li>TypeScript</li><li>React</li><li>Next.js</li><li>C/C++</li><li>Docker</li>
            </ul>
          </section>

        </aside>
      </div>

      <footer class="footer" data-od-id="portfolio-footer">
        <span>session: active · last login: berlin/de</span>
        
      </footer>
    </section>
  </main>

  <script>
    const form = document.querySelector('#command-form');
    const input = document.querySelector('#command-input');
    const output = document.querySelector('#command-output');
    const responses = {
      about: 'Peter Mölzer — full-stack software developer · Berlin / DE',
      stack: 'TypeScript · React · Next.js · C/C++ · Docker',
      links: 'GitHub: github.com/peterle95 · LinkedIn: profile URL not provided',
      help: 'Available commands: about, stack, links, clear, help'
    };

    function runCommand(rawCommand) {
      const command = rawCommand.trim().toLowerCase();
      if (!command) return;
      if (command === 'clear') {
        output.textContent = '';
      } else {
        output.textContent = responses[command] || `command not found: ${command}. Try “help”.`;
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      runCommand(input.value);
      input.value = '';
    });
  </script>


</body></html>
